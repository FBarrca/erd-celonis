[project]
name = "erd-celonis"
version = "0.1.0"
description = "Generate NetworkX entity-relationship diagrams from Celonis data models"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "numpy>=2.0,<3.0",
    "pandas>=2.2,<3.0",
    "pydantic>=2.0,<3.0",
    "pycelonis>=2.12,<3.0",
    "pycelonis-core>=2.10.2,<3.0",
    "pyyaml>=6.0,<7.0",
    "python-dotenv>=1.0,<2.0",
    "saolapy>=0.3.3,<1.0",
    "networkx>=3.6.1",
    "matplotlib>=3.9,<4.0",
    "fire>=0.7.1",
]

[project.scripts]
erd-celonis = "erd_celonis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["erd_celonis"]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"

[[tool.uv.index]]
name = "celonis"
url = "https://pypi.celonis.cloud/"
explicit = true

[tool.uv.sources]
pycelonis = { index = "celonis" }
pycelonis-core = { index = "celonis" }
saolapy = { index = "celonis" }
